<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classificador BCB 229</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #161616; --bg3: #1f1f1f;
    --border: #2a2a2a; --border2: #363636;
    --text: #e8e8e8; --text2: #888; --text3: #555;
    --green: #22c55e; --green-bg: rgba(34,197,94,0.08);
    --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.08);
    --amber: #f59e0b; --amber-bg: rgba(245,158,11,0.08);
    --red: #ef4444; --red-bg: rgba(239,68,68,0.08);
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; padding: 2rem; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
  header h1 { font-family: var(--mono); font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  header p { font-size: 12px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }
  .search-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  input[type="text"] { flex: 1; background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 10px 14px; outline: none; transition: border-color 0.15s; border-radius: 4px; }
  input[type="text"]:focus { border-color: var(--border2); }
  input[type="text"]::placeholder { color: var(--text3); }
  button { background: var(--text); color: var(--bg); border: none; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 10px 20px; cursor: pointer; transition: opacity 0.15s; border-radius: 4px; white-space: nowrap; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status-bar { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 1.5rem; min-height: 16px; display: flex; align-items: center; gap: 8px; }
  .status-bar.error { color: var(--red); }
  .status-bar.ok { color: var(--green); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .data-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-family: var(--mono); font-size: 11px; color: var(--text2); margin-bottom: 1.5rem; }
  .data-badge .label { color: var(--text3); }
  .data-badge .value { color: var(--amber); }
  .result-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 1.5rem; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .result-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .inst-name { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .cat-badge { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 3px; }
  .cat-A { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
  .cat-B { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.2); }
  .cat-C { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border-bottom: 1px solid var(--border); }
  .metric { padding: 14px 20px; border-right: 1px solid var(--border); }
  .metric:last-child { border-right: none; }
  .metric-label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .metric-value { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .ok { color: var(--green); }
  .warn { color: var(--amber); }
  .fail { color: var(--red); }
  .na { color: var(--text3); }
  .fpr-section { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; }
  .fpr-box { flex: 1; min-width: 120px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; text-align: center; }
  .fpr-box .label { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-bottom: 6px; }
  .fpr-box .value { font-family: var(--mono); font-size: 22px; font-weight: 500; }
  .reasoning { padding: 14px 20px; }
  .reasoning-title { font-size: 10px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .step:last-child { border-bottom: none; }
  .step-art { font-family: var(--mono); color: var(--text3); min-width: 80px; font-size: 11px; padding-top: 1px; }
  .step-desc { color: var(--text2); flex: 1; line-height: 1.5; }
  .step-result { font-family: var(--mono); font-size: 11px; padding-top: 1px; white-space: nowrap; }
  .history-section { margin-top: 2rem; }
  .history-title { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--mono); }
  th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text2); }
  td:first-child { color: var(--text); }
  tr:last-child td { border-bottom: none; }
  .clear-btn { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 11px; padding: 6px 12px; margin-top: 12px; float: right; }
  .clear-btn:hover { color: var(--text); border-color: var(--border2); }
  .suggestions { position: absolute; background: var(--bg2); border: 1px solid var(--border2); border-radius: 4px; z-index: 10; max-height: 220px; overflow-y: auto; font-family: var(--mono); font-size: 12px; min-width: 300px; }
  .suggestion-item { padding: 8px 14px; cursor: pointer; color: var(--text2); border-bottom: 1px solid var(--border); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--bg3); color: var(--text); }
  .search-wrap { position: relative; flex: 1; }
</style>
</head>

<header>
  <h1>// classificador bcb 229</h1>
  <p>arts. 29–33 · categorias de risco A, B, C · FPR aplicável · fonte: IF.data BCB</p>
</header>

<div class="search-row">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="nome da contraparte (ex: stone, cielo, inter, pagseguro...)" autocomplete="off" />
    <div class="suggestions" id="suggestions" style="display:none"></div>
  </div>
  <button id="searchBtn" onclick="classificar()">classificar</button>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="data-badge">

  <span class="value">dez/2025</span>

  <span class="value" style="color:var(--text2)">IF.data / BCB</span>

<div id="resultArea"></div>

  <button class="clear-btn" onclick="limparHistorico()">limpar histórico</button>
</div>

function pct(v) {
  if (!v || v === 'NA' || v === 'NI' || v === 'NA%' || v === 'NI%') return null;
  const n = parseFloat(String(v).replace('%','').replace(',','.'));
  return isNaN(n) ? null : n;
}

function num(v) {
  if (!v || v === 'NA' || v === 'NI') return null;
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

function classificar() {
  const query = document.getElementById('searchInput').value.trim().toUpperCase();
  document.getElementById('suggestions').style.display = 'none';
  if (!query) return;

  const matches = DADOS.filter(d => d.nome.toUpperCase().includes(query));
  if (matches.length === 0) {
    setStatus(`nenhuma instituição encontrada para "${query}"`, 'error');
    document.getElementById('resultArea').innerHTML = '';
    return;
  }

  // Prefere prudencial
  const inst = matches.find(d => d.nome.toUpperCase().includes('PRUDENCIAL')) || matches[0];
  const resultado = classificarBCB229(inst);
  document.getElementById('resultArea').innerHTML = renderResult(inst, resultado);
  addHistorico(inst, resultado);
  setStatus(`${matches.length} inst. encontrada(s) · exibindo: ${inst.nome}`, 'ok');
}

function setStatus(msg, type='') {
  const el = document.getElementById('statusBar');

}

  const steps = [];

  // TCBs bancários: b1, b2, b3S (coop. singulares), b3C (coop. centrais), b4
  // TCBs não-bancários: n1 (congl. Tipo 3 S1-S4), n2 (congl. Tipo 3 S5), n4 (IP pura não conglomerada)
  const isBancario = ['b1','b2','b3S','b3C','b4'].includes(tcb);
  const isN1 = tcb === 'n1';
  const isN2 = tcb === 'n2';
  const isN4 = tcb === 'n4';
  const autorizada = isBancario || isN1 || isN2 || isN4;
  steps.push({ art:'Art. 29, I', desc:'Autorizada pelo BCB?', ok: autorizada, val: autorizada ? `Sim — ${tcb}` : 'Não' });
  if (!autorizada) return { cat: null, fpr90: 100, fpr90plus: 100, steps, basileia, capPrincipal, adicional, ra };

  let normativo = '';
  if (isBancario) {
    normativo = 'CMN 4.958/2021 (Art. 30, I)';
  } else if (isN1) {
    normativo = sr === 'S5' ? 'BCB 201/2022 (Art. 30, VI)' : 'BCB 200/2022 (Art. 30, V)';
  } else if (isN2) {
    normativo = 'BCB 201/2022 (Art. 30, VI)';
  } else if (isN4) {
    normativo = sr === 'NA' ? 'BCB 198/2022 (Art. 30, IV)' : 'BCB 200/2022 (Art. 30, V)';
  } else {
    normativo = 'Não identificado';
  }
  steps.push({ art:'Art. 30', desc:`Normativo: ${normativo}`, ok: true, val: 'Identificado' });

  const cumpMinimos = basileia !== null && basileia > 0;
  steps.push({ art:'Art. 30, §1º, I', desc: basileia !== null ? `Índice de Basileia: ${basileia.toFixed(2)}%` : 'Sem informação de Basileia', ok: cumpMinimos, val: cumpMinimos ? 'Cumpre' : 'Não cumpre / sem info' });
  if (!cumpMinimos) return { cat:'C', fpr90: 150, fpr90plus: 150, steps, basileia, capPrincipal, adicional, ra };

  // Para n4 (IP): Capital Principal = Patrimônio, Adicional não se aplica → direto Categoria A
  if (isN4) {
    steps.push({ art:'Art. 30, §1º, II', desc:'IP (n4): Adicional de Capital Principal não aplicável — Capital Principal equivale ao Patrimônio', ok: true, val:'N/A → Cat. A' });
    steps.push({ art:'Art. 30', desc:'Cumpre requerimentos mínimos → Categoria A', ok: true, val:'→ Cat. A' });
  } else {
    const temAdicional = adicional !== null;
    steps.push({ art:'Art. 30, §1º, II', desc: temAdicional ? `Adicional disponível: R$ ${adicional.toLocaleString('pt-BR')} mil` : 'Adicional de Capital Principal não disponível (NA)', ok: temAdicional, val: temAdicional ? 'Disponível' : 'Não disponível' });
    if (!temAdicional) {
      steps.push({ art:'Art. 31', desc:'Cumpre mínimos mas sem info do Adicional → Categoria B', ok: null, val:'→ Cat. B' });
      return { cat:'B', fpr90: 50, fpr90plus: 75, steps, basileia, capPrincipal, adicional, ra };
    }
    steps.push({ art:'Art. 30', desc:'Cumpre mínimos e Adicional → Categoria A', ok: true, val:'→ Cat. A' });
  }

  const cp14 = capPrincipal !== null && capPrincipal >= 14;
  const ra5 = ra !== null && ra >= 5;
  const fpr30 = cp14 && ra5;
  steps.push({ art:'Art. 33, §1º', desc:`FPR 30%: ICP ${capPrincipal !== null ? capPrincipal.toFixed(2)+'%' : 'NA'} (≥14?) · RA ${ra !== null ? ra.toFixed(2)+'%' : 'NA'} (≥5?)`, ok: fpr30, val: fpr30 ? '30% aplicável' : (capPrincipal === null || ra === null) ? 'Não confirmável' : 'Não aplicável' });

  return { cat:'A', fpr90: 20, fpr90plus: fpr30 ? 30 : 40, steps, basileia, capPrincipal, adicional, ra };
}

function renderResult(inst, r) {
  const { cat, fpr90, fpr90plus, steps, basileia, capPrincipal, adicional, ra } = r;
  const catClass = cat ? `cat-${cat}` : 'cat-C';
  const bv = basileia !== null ? basileia.toFixed(2)+'%' : 'NA';
  const cpv = capPrincipal !== null ? capPrincipal.toFixed(2)+'%' : 'NA';
  const adv = adicional !== null ? 'R$ '+adicional.toLocaleString('pt-BR') : 'NA';
  const rav = ra !== null ? ra.toFixed(2)+'%' : 'NA';
  const bCls = basileia !== null && basileia > 0 ? 'ok' : 'na';
  const cpCls = capPrincipal !== null ? (capPrincipal >= 14 ? 'ok' : 'warn') : 'na';
  const adCls = adicional !== null ? 'ok' : 'na';
  const raCls = ra !== null ? (ra >= 5 ? 'ok' : 'warn') : 'na';
  const stepsHtml = steps.map(s => {
    const cls = s.ok === true ? 'ok' : s.ok === false ? 'fail' : 'warn';
    return `<div class="step"><span class="step-art">${s.art}</span><span class="step-desc">${s.desc}</span><span class="step-result ${cls}">${s.val}</span></div>`;
  }).join('');
  return `<div class="result-card">
    <div class="result-header">
      <div class="inst-name">${inst.nome}</div>
      <span class="cat-badge ${catClass}">CAT ${cat||'—'}</span>
    </div>
    <div class="metrics-grid">
      <div class="metric"><div class="metric-label">TCB / SR</div><div class="metric-value" style="font-size:13px;color:var(--text2)">${inst.tcb} / ${inst.sr||'NA'}</div></div>
      <div class="metric"><div class="metric-label">Basileia</div><div class="metric-value ${bCls}">${bv}</div></div>
      <div class="metric"><div class="metric-label">Cap. Principal</div><div class="metric-value ${cpCls}">${cpv}</div></div>
      <div class="metric"><div class="metric-label">Adicional</div><div class="metric-value ${adCls}" style="font-size:12px">${adv}</div></div>
      <div class="metric"><div class="metric-label">Razão Alavancagem</div><div class="metric-value ${raCls}">${rav}</div></div>
    </div>
    <div class="fpr-section">
      <div class="fpr-box"><div class="label">FPR prazo ≤ 90 dias</div><div class="value">${fpr90}%</div></div>
      <div class="fpr-box"><div class="label">FPR prazo &gt; 90 dias</div><div class="value">${fpr90plus}%</div></div>
    </div>
    <div class="reasoning"><div class="reasoning-title">// fluxo de classificação</div>${stepsHtml}</div>
  </div>`;
}

function addHistorico(inst, r) {
  const { cat, fpr90, fpr90plus, basileia, capPrincipal, adicional } = r;
  historico.push({ nome: inst.nome, tcb: inst.tcb, sr: inst.sr||'NA',
    basileia: basileia !== null ? basileia.toFixed(2)+'%' : 'NA',
    capPrincipal: capPrincipal !== null ? capPrincipal.toFixed(2)+'%' : 'NA',
    adicional: adicional !== null ? 'R$ '+adicional.toLocaleString('pt-BR') : 'NA',
    cat: cat||'—', fpr90, fpr90plus });
  renderHistorico();
}

function renderHistorico() {
  if (!historico.length) { document.getElementById('historySection').style.display='none'; return; }
  document.getElementById('historySection').style.display='block';
  const body = document.getElementById('historyBody');
  body.innerHTML = historico.map(h => {
    const cc = h.cat === 'A' ? 'ok' : h.cat === 'B' ? '' : 'fail';
    return `<tr><td>${h.nome}</td><td>${h.tcb}</td><td>${h.sr}</td><td>${h.basileia}</td><td>${h.capPrincipal}</td><td>${h.adicional}</td><td class="${cc}">${h.cat}</td><td>${h.fpr90}%</td><td>${h.fpr90plus}%</td></tr>`;
  }).join('');
}

function limparHistorico() { historico = []; renderHistorico(); }

// Autocomplete
const input = document.getElementById('searchInput');
const sugg = document.getElementById('suggestions');
input.addEventListener('input', () => {
  const q = input.value.trim().toUpperCase();
  if (q.length < 2) { sugg.style.display='none'; return; }
  const matches = DADOS.filter(d => d.nome.toUpperCase().includes(q)).slice(0, 8);
  if (!matches.length) { sugg.style.display='none'; return; }
  sugg.innerHTML = matches.map(d => `<div class="suggestion-item" onclick="selectSugg('${d.nome.replace(/'/g, "\\'")}')">${d.nome}</div>`).join('');
  sugg.style.display='block';
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') { sugg.style.display='none'; classificar(); } if (e.key === 'Escape') sugg.style.display='none'; });
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) sugg.style.display='none'; });
function selectSugg(nome) {
  input.value = nome;
  sugg.style.display='none';
  classificar();
}
</script>
</body>
</html>
